<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник зарплаты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .stat-card { border-radius: 15px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .day-working { border-left: 4px solid #198754; }
        .day-dayoff { border-left: 4px solid #6c757d; }
        .navbar-brand { font-weight: bold; }
        .group-row { cursor: pointer; }
        .details-row td { padding: 0; }
        #loginScreen { max-width: 400px; margin: 100px auto; }
    </style>
</head>
<body>
    <!-- Экран входа (показывается, если не авторизованы) -->
    <div id="loginScreen" class="container" style="display: none;">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="card-title text-center mb-4">🔐 Вход в дневник</h3>
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Логин</label>
                        <input type="text" class="form-control" id="loginField" required autocomplete="username">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Пароль</label>
                        <input type="password" class="form-control" id="passwordField" required autocomplete="current-password">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <p class="text-muted small mt-3 text-center">Новый логин создаст аккаунт автоматически</p>
                <div id="loginError" class="alert alert-danger mt-2" style="display: none;"></div>
            </div>
        </div>
    </div>

    <!-- Основной интерфейс дневника (показывается после входа) -->
    <div id="mainApp" style="display: none;">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container">
                <span class="navbar-brand">💰 Дневник зарплаты</span>
                <div class="navbar-nav ms-auto">
                    <span class="navbar-text me-3" id="currentUserDisplay"></span>
                    <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#addPresetModal">⚡ Категории</button>
                    <button class="btn btn-success me-2" data-bs-toggle="modal" data-bs-target="#addDayModal">+ Добавить траты</button>
                    <button class="btn btn-outline-danger" id="logoutBtn">Выйти</button>
                </div>
            </div>
        </nav>

        <div class="container">
            <h3 class="mb-3">📊 Статистика</h3>
            <div id="statsContainer"></div>

            <h3 class="mb-3 mt-4">📅 Журнал дней</h3>
            <div class="table-responsive">
                <table class="table table-hover align-middle bg-white shadow-sm rounded">
                    <thead class="table-dark">
                        <tr><th>Дата</th><th>Тип дня</th><th>Доход</th><th>Расход</th><th></th></tr>
                    </thead>
                    <tbody id="daysTableBody"></tbody>
                </table>
            </div>
            <div id="noDaysMessage" class="text-center text-muted mt-3" style="display: none;">Нет записей. Добавьте первую трату!</div>
        </div>
    </div>

    <!-- Модальные окна (как были) -->
    <div class="modal fade" id="addDayModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dayModalTitle">Добавить траты</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="dayForm">
                        <input type="hidden" id="editDayIndex" value="-1">
                        <div class="mb-3">
                            <label class="form-label">Дата (дд.мм.гггг)</label>
                            <input type="date" class="form-control" id="dayDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Тип дня</label>
                            <select class="form-select" id="dayType">
                                <option value="working">Рабочий</option>
                                <option value="dayoff">Выходной</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория</label>
                            <select class="form-select" id="presetSelect"></select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Доход (₽)</label>
                            <input type="number" class="form-control" id="dayIncome" step="0.01" min="0" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Расход (₽)</label>
                            <input type="number" class="form-control" id="dayExpense" step="0.01" min="0" value="0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveDayBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addPresetModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">⚡ Категории</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <button class="btn btn-success btn-sm" id="showAddPresetFormBtn">+ Создать категорию</button>
                    </div>
                    <div id="addPresetFormContainer" style="display: none;" class="border p-3 mb-3 rounded bg-light">
                        <h6>Новая категория</h6>
                        <input type="hidden" id="editPresetId" value="">
                        <div class="mb-2">
                            <input type="text" class="form-control" id="presetName" placeholder="Название">
                        </div>
                        <button class="btn btn-primary btn-sm" id="savePresetBtn">Сохранить</button>
                        <button class="btn btn-secondary btn-sm" id="cancelPresetEditBtn">Отмена</button>
                    </div>
                    <hr>
                    <h6>Сохранённые категории</h6>
                    <div class="list-group" id="presetsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // ========== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ==========
        let days = [];
        let presets = [];
        const DEFAULT_CATEGORY = 'Еда и прочее';
        let authToken = null;
        let currentUser = null;

        // ========== АВТОРИЗАЦИЯ ==========
        async function login(login, password) {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ login, password })
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.error || 'Ошибка входа');
            authToken = data.token;
            currentUser = data.login;
            localStorage.setItem('auth_token', authToken);
            localStorage.setItem('auth_user', currentUser);
            return data;
        }

        function logout() {
            authToken = null;
            currentUser = null;
            localStorage.removeItem('auth_token');
            localStorage.removeItem('auth_user');
            document.getElementById('loginScreen').style.display = 'block';
            document.getElementById('mainApp').style.display = 'none';
        }

        // Проверяем сохранённую сессию при загрузке
        async function checkSession() {
            const savedToken = localStorage.getItem('auth_token');
            const savedUser = localStorage.getItem('auth_user');
            if (savedToken && savedUser) {
                // Попробуем загрузить данные – если 401, сессия недействительна
                try {
                    const res = await fetch('/api/load', {
                        headers: { 'Authorization': `Bearer ${savedToken}` }
                    });
                    if (!res.ok) throw new Error('invalid');
                    authToken = savedToken;
                    currentUser = savedUser;
                    return true;
                } catch (e) {
                    logout();
                }
            }
            return false;
        }

        // ========== API С АВТОРИЗАЦИЕЙ ==========
        async function saveData() {
            const data = { days, presets };
            if (!authToken) throw new Error('Не авторизован');
            try {
                const res = await fetch('/api/save', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(data)
                });
                if (!res.ok) {
                    if (res.status === 401) { logout(); return; }
                    throw new Error('Ошибка сохранения');
                }
                console.log('✅ Данные сохранены в облако');
            } catch (e) {
                console.error('Ошибка сохранения:', e);
                // fallback localStorage
                localStorage.setItem('salary_diary_days', JSON.stringify(days));
                localStorage.setItem('salary_diary_presets', JSON.stringify(presets));
            }
        }

        async function loadData() {
            if (!authToken) throw new Error('Не авторизован');
            try {
                const res = await fetch('/api/load', {
                    headers: { 'Authorization': `Bearer ${authToken}` }
                });
                if (!res.ok) {
                    if (res.status === 401) { logout(); return; }
                    throw new Error('Ошибка загрузки');
                }
                const data = await res.json();
                const hasRemoteDays = Array.isArray(data.days) && data.days.length > 0;
                const hasRemotePresets = Array.isArray(data.presets) && data.presets.length > 0;
                if (hasRemoteDays || hasRemotePresets) {
                    days = data.days || [];
                    presets = data.presets || [];
                    console.log('📥 Данные загружены из облака');
                    localStorage.setItem('salary_diary_days', JSON.stringify(days));
                    localStorage.setItem('salary_diary_presets', JSON.stringify(presets));
                } else {
                    console.warn('Облако пустое, пробуем localStorage');
                    const savedDays = localStorage.getItem('salary_diary_days');
                    const savedPresets = localStorage.getItem('salary_diary_presets');
                    days = savedDays ? JSON.parse(savedDays) : [];
                    presets = savedPresets ? JSON.parse(savedPresets) : [];
                    if (days.length > 0 || presets.length > 0) {
                        console.log('📤 Отправляем локальные данные в облако...');
                        await saveData();
                    }
                }
            } catch (e) {
                console.warn('Ошибка загрузки из облака, берём localStorage');
                const savedDays = localStorage.getItem('salary_diary_days');
                const savedPresets = localStorage.getItem('salary_diary_presets');
                days = savedDays ? JSON.parse(savedDays) : [];
                presets = savedPresets ? JSON.parse(savedPresets) : [];
            }
        }

        // ========== ИНИЦИАЛИЗАЦИЯ ==========
        document.addEventListener('DOMContentLoaded', async () => {
            const loggedIn = await checkSession();
            if (loggedIn) {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('currentUserDisplay').textContent = `👤 ${currentUser}`;
                await loadData();
                ensureDefaultCategory();
                renderAll();
                attachEventListeners();
                document.getElementById('dayDate').value = new Date().toISOString().split('T')[0];
            } else {
                document.getElementById('loginScreen').style.display = 'block';
                document.getElementById('mainApp').style.display = 'none';
            }
        });

        // Обработчик формы входа
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const loginField = document.getElementById('loginField').value.trim();
            const passwordField = document.getElementById('passwordField').value;
            const errorEl = document.getElementById('loginError');
            errorEl.style.display = 'none';
            try {
                await login(loginField, passwordField);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').style.display = 'block';
                document.getElementById('currentUserDisplay').textContent = `👤 ${currentUser}`;
                await loadData();
                ensureDefaultCategory();
                renderAll();
                attachEventListeners();
                document.getElementById('dayDate').value = new Date().toISOString().split('T')[0];
            } catch (err) {
                errorEl.textContent = err.message;
                errorEl.style.display = 'block';
            }
        });

        // Кнопка выхода
        document.getElementById('logoutBtn').addEventListener('click', () => {
            logout();
            days = [];
            presets = [];
            renderAll();
        });

        // ========== ОСТАЛЬНЫЕ ФУНКЦИИ (без изменений) ==========
        function ensureDefaultCategory() {
            if (!presets.some(p => p.name === DEFAULT_CATEGORY)) {
                presets.push({ id: generateId(), name: DEFAULT_CATEGORY });
                saveData();
            }
        }

        function renderAll() {
            renderDaysTable();
            renderStats();
            renderPresetsList();
            renderPresetSelect();
        }

        function renderDaysTable() {
            const tbody = document.getElementById('daysTableBody');
            const noMsg = document.getElementById('noDaysMessage');
            tbody.innerHTML = '';
            if (days.length === 0) {
                noMsg.style.display = 'block';
                return;
            }
            noMsg.style.display = 'none';

            const grouped = new Map();
            days.forEach(day => {
                if (!grouped.has(day.date)) grouped.set(day.date, []);
                grouped.get(day.date).push(day);
            });

            const sortedDates = Array.from(grouped.keys()).sort((a, b) => parseDate(b) - parseDate(a));

            sortedDates.forEach(date => {
                const group = grouped.get(date);
                const totalIncome = group.reduce((sum, d) => sum + (Number(d.income) || 0), 0);
                const totalExpense = group.reduce((sum, d) => sum + (Number(d.expense) || 0), 0);
                const displayType = group[0].type;

                const groupRow = document.createElement('tr');
                groupRow.className = `group-row day-${displayType}`;
                groupRow.innerHTML = `<td><strong>${date}</strong> <span class="toggle-icon">▶</span></td>
                    <td>${getDayTypeName(displayType)}</td>
                    <td class="text-success fw-bold">${totalIncome.toFixed(2)} ₽</td>
                    <td class="text-danger fw-bold">${totalExpense.toFixed(2)} ₽</td>
                    <td></td>`;
                tbody.appendChild(groupRow);

                const detailsRow = document.createElement('tr');
                detailsRow.className = 'details-row';
                detailsRow.style.display = 'none';
                detailsRow.innerHTML = `<td colspan="5" class="p-0">
                    <div class="p-2 bg-light">
                        <table class="table table-sm mb-0">
                            <thead><tr><th>Категория</th><th>Доход</th><th>Расход</th><th></th></tr></thead>
                            <tbody>${group.map(day => {
                                const realIndex = days.indexOf(day);
                                return `<tr>
                                    <td>${day.category}</td>
                                    <td class="text-success">${day.income.toFixed(2)} ₽</td>
                                    <td class="text-danger">${day.expense.toFixed(2)} ₽</td>
                                    <td>
                                        <button class="btn btn-sm btn-outline-secondary edit-day-btn" data-index="${realIndex}">✏️</button>
                                        <button class="btn btn-sm btn-outline-danger delete-day-btn" data-index="${realIndex}">🗑️</button>
                                    </td>
                                </tr>`;
                            }).join('')}</tbody>
                        </table>
                    </div></td>`;
                tbody.appendChild(detailsRow);

                groupRow.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;
                    const icon = groupRow.querySelector('.toggle-icon');
                    if (detailsRow.style.display === 'none') {
                        detailsRow.style.display = '';
                        icon.textContent = '▼';
                    } else {
                        detailsRow.style.display = 'none';
                        icon.textContent = '▶';
                    }
                });
            });
        }

        // Статистика, категории, вспомогательные функции оставлены без изменений
        // ... (весь остальной код из предыдущего полного index.html, начиная с renderStats() и до конца)
        // ВАЖНО: вставить весь оставшийся код ниже, не копируя заново верхнюю часть.
    </script>
</body>
</html>
