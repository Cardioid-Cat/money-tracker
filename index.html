<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник зарплаты</title>
    <!-- Bootstrap 5 CSS (бесплатный CDN) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Немного своих стилей для удобства -->
    <style>
        body { background-color: #f8f9fa; }
        .stat-card { border-radius: 15px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .day-working { border-left: 4px solid #198754; }
        .day-dayoff { border-left: 4px solid #6c757d; }
        .day-vacation { border-left: 4px solid #0dcaf0; }
        .day-sick { border-left: 4px solid #ffc107; }
        .navbar-brand { font-weight: bold; }
    </style>
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">💰 Дневник зарплаты</span>
            <div class="navbar-nav ms-auto">
                <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#addPresetModal">⚡ Пресеты</button>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addDayModal">+ Добавить день</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Статистика (дашборд) -->
        <h3 class="mb-3">📊 Статистика</h3>
        <div class="row g-3 mb-4" id="statsContainer">
            <!-- Здесь JS вставит карточки статистики -->
        </div>

        <!-- Журнал дней -->
        <h3 class="mb-3">📅 Журнал дней</h3>
        <div class="table-responsive">
            <table class="table table-hover align-middle bg-white shadow-sm rounded">
                <thead class="table-dark">
                    <tr>
                        <th>Дата</th>
                        <th>Тип дня</th>
                        <th>Доход</th>
                        <th>Расход</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="daysTableBody">
                    <!-- JS заполнит строками -->
                </tbody>
            </table>
        </div>
        <div id="noDaysMessage" class="text-center text-muted mt-3" style="display: none;">
            Нет записей. Добавьте первый рабочий день!
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: Добавление/редактирование дня ===== -->
    <div class="modal fade" id="addDayModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dayModalTitle">Добавить день</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="dayForm">
                        <input type="hidden" id="editDayIndex" value="-1"> <!-- -1 значит новый день, иначе индекс для редактирования -->
                        <div class="mb-3">
                            <label class="form-label">Дата (дд.мм.гггг)</label>
                            <input type="date" class="form-control" id="dayDate" required>
                            <small class="text-muted">Выберите дату в календаре</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Тип дня</label>
                            <select class="form-select" id="dayType">
                                <option value="working">Рабочий</option>
                                <option value="dayoff">Выходной</option>
                                <option value="vacation">Отпуск</option>
                                <option value="sick">Больничный</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Применить пресет (необязательно)</label>
                            <select class="form-select" id="presetSelect">
                                <option value="">-- Не использовать --</option>
                                <!-- JS добавит варианты -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Доход (₽)</label>
                            <input type="number" class="form-control" id="dayIncome" step="0.01" min="0" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Расход (₽)</label>
                            <input type="number" class="form-control" id="dayExpense" step="0.01" min="0" value="0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveDayBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: Управление пресетами ===== -->
    <div class="modal fade" id="addPresetModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">⚡ Пресеты доходов/расходов</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <button class="btn btn-success btn-sm" id="showAddPresetFormBtn">+ Создать новый пресет</button>
                    </div>
                    <div id="addPresetFormContainer" style="display: none;" class="border p-3 mb-3 rounded bg-light">
                        <h6>Новый пресет</h6>
                        <input type="hidden" id="editPresetId" value="">
                        <div class="mb-2">
                            <input type="text" class="form-control" id="presetName" placeholder="Название (например, Обычная смена)">
                        </div>
                        <div class="mb-2">
                            <select class="form-select" id="presetType">
                                <option value="income">Доход</option>
                                <option value="expense">Расход</option>
                                <option value="both">Доход и расход</option>
                            </select>
                        </div>
                        <div class="mb-2" id="presetIncomeGroup">
                            <label class="form-label">Доход по умолчанию (₽)</label>
                            <input type="number" class="form-control" id="presetIncome" step="0.01" min="0" value="0">
                        </div>
                        <div class="mb-2" id="presetExpenseGroup">
                            <label class="form-label">Расход по умолчанию (₽)</label>
                            <input type="number" class="form-control" id="presetExpense" step="0.01" min="0" value="0">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">Тип дня по умолчанию</label>
                            <select class="form-select" id="presetDayType">
                                <option value="working">Рабочий</option>
                                <option value="dayoff">Выходной</option>
                                <option value="vacation">Отпуск</option>
                                <option value="sick">Больничный</option>
                            </select>
                        </div>
                        <button class="btn btn-primary btn-sm" id="savePresetBtn">Сохранить пресет</button>
                        <button class="btn btn-secondary btn-sm" id="cancelPresetEditBtn">Отмена</button>
                    </div>
                    <hr>
                    <h6>Сохранённые пресеты</h6>
                    <div class="list-group" id="presetsList">
                        <!-- Список пресетов -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS (бесплатный CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Основная логика приложения -->
    <script>
        // ======  ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ И ХРАНИЛИЩЕ  ======
        let days = [];           // Массив записей дней: { date, type, income, expense }
        let presets = [];       // Массив пресетов: { id, name, type, income, expense, dayType }
        const STORAGE_DAYS = 'salary_diary_days';
        const STORAGE_PRESETS = 'salary_diary_presets';

        // ======  ИНИЦИАЛИЗАЦИЯ ПРИ ЗАГРУЗКЕ СТРАНИЦЫ  ======
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderAll();
            attachEventListeners();
            // Установить сегодняшнюю дату в поле даты по умолчанию
            document.getElementById('dayDate').value = new Date().toISOString().split('T')[0];
        });

        // ======  РАБОТА С ДАННЫМИ (LocalStorage)  ======
        function loadData() {
            const savedDays = localStorage.getItem(STORAGE_DAYS);
            const savedPresets = localStorage.getItem(STORAGE_PRESETS);
            days = savedDays ? JSON.parse(savedDays) : [];
            presets = savedPresets ? JSON.parse(savedPresets) : [];
        }

        function saveData() {
            localStorage.setItem(STORAGE_DAYS, JSON.stringify(days));
            localStorage.setItem(STORAGE_PRESETS, JSON.stringify(presets));
        }

        // ======  ОТРИСОВКА ВСЕГО ИНТЕРФЕЙСА  ======
        function renderAll() {
            renderDaysTable();
            renderStats();
            renderPresetsList();
            renderPresetSelect();
        }

        // ----- Таблица дней -----
        function renderDaysTable() {
            const tbody = document.getElementById('daysTableBody');
            const noMsg = document.getElementById('noDaysMessage');
            tbody.innerHTML = '';
            if (days.length === 0) {
                noMsg.style.display = 'block';
                return;
            }
            noMsg.style.display = 'none';
            // Сортировка по дате (от новых к старым)
            const sortedDays = [...days].sort((a, b) => {
                const dateA = parseDate(a.date);
                const dateB = parseDate(b.date);
                return dateB - dateA;
            });
            sortedDays.forEach((day, sortedIndex) => {
                // Поскольку индекс в общем массиве может отличаться, найдём реальный индекс
                const realIndex = days.indexOf(day);
                const row = document.createElement('tr');
                // Класс для цветовой полосы слева
                row.className = `day-${day.type}`;
                row.innerHTML = `
                    <td>${day.date}</td>
                    <td>${getDayTypeName(day.type)}</td>
                    <td class="text-success fw-bold">${day.income.toFixed(2)} ₽</td>
                    <td class="text-danger fw-bold">${day.expense.toFixed(2)} ₽</td>
                    <td>
                        <button class="btn btn-sm btn-outline-secondary edit-day-btn" data-index="${realIndex}">✏️</button>
                        <button class="btn btn-sm btn-outline-danger delete-day-btn" data-index="${realIndex}">🗑️</button>
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // ----- Статистика (все расчёты здесь) -----
        function renderStats() {
            const container = document.getElementById('statsContainer');
            if (days.length === 0) {
                container.innerHTML = `<div class="col-12 text-muted">Нет данных для статистики</div>`;
                return;
            }

            // Общие суммы
            let totalIncome = 0, totalExpense = 0;
            let workingDays = [], allDays = [];

            days.forEach(day => {
                const income = Number(day.income) || 0;
                const expense = Number(day.expense) || 0;
                totalIncome += income;
                totalExpense += expense;
                allDays.push(day);
                if (day.type === 'working') {
                    workingDays.push(day);
                }
            });

            const daysCount = allDays.length;
            const workingDaysCount = workingDays.length;

            // Средние за день (все дни)
            const avgIncomeAll = daysCount > 0 ? totalIncome / daysCount : 0;
            const avgExpenseAll = daysCount > 0 ? totalExpense / daysCount : 0;

            // Средние за рабочий день
            const totalWorkingIncome = workingDays.reduce((sum, d) => sum + (Number(d.income) || 0), 0);
            const totalWorkingExpense = workingDays.reduce((sum, d) => sum + (Number(d.expense) || 0), 0);
            const avgIncomeWorking = workingDaysCount > 0 ? totalWorkingIncome / workingDaysCount : 0;
            const avgExpenseWorking = workingDaysCount > 0 ? totalWorkingExpense / workingDaysCount : 0;

            const netBalance = totalIncome - totalExpense;

            // Собираем карточки
            const cards = [
                { title: 'Общий доход', value: `${totalIncome.toFixed(2)} ₽`, color: 'bg-success text-white' },
                { title: 'Общий расход', value: `${totalExpense.toFixed(2)} ₽`, color: 'bg-danger text-white' },
                { title: 'Чистый остаток', value: `${netBalance.toFixed(2)} ₽`, color: netBalance >= 0 ? 'bg-primary text-white' : 'bg-warning text-dark' },
                { title: 'Средний доход / день', value: `${avgIncomeAll.toFixed(2)} ₽`, color: 'bg-info text-dark' },
                { title: 'Средний расход / день', value: `${avgExpenseAll.toFixed(2)} ₽`, color: 'bg-info text-dark' },
                { title: 'Средний доход / раб. день', value: `${avgIncomeWorking.toFixed(2)} ₽`, color: 'bg-success text-white' },
                { title: 'Средний расход / раб. день', value: `${avgExpenseWorking.toFixed(2)} ₽`, color: 'bg-danger text-white' },
                { title: 'Всего рабочих дней', value: `${workingDaysCount} из ${daysCount}`, color: 'bg-secondary text-white' }
            ];

            container.innerHTML = cards.map(card => `
                <div class="col-sm-6 col-md-4 col-lg-3">
                    <div class="card stat-card ${card.color} shadow-sm">
                        <div class="card-body">
                            <h6 class="card-title">${card.title}</h6>
                            <p class="card-text fs-5 fw-bold">${card.value}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // ----- Список пресетов в модальном окне -----
        function renderPresetsList() {
            const list = document.getElementById('presetsList');
            list.innerHTML = '';
            if (presets.length === 0) {
                list.innerHTML = '<div class="list-group-item text-muted">Пресетов пока нет</div>';
                return;
            }
            presets.forEach(preset => {
                const item = document.createElement('div');
                item.className = 'list-group-item d-flex justify-content-between align-items-center';
                let desc = `${preset.name} | Тип: ${getPresetTypeName(preset.type)}`;
                if (preset.type === 'income' || preset.type === 'both') desc += ` | Доход: ${preset.income.toFixed(2)} ₽`;
                if (preset.type === 'expense' || preset.type === 'both') desc += ` | Расход: ${preset.expense.toFixed(2)} ₽`;
                desc += ` | День: ${getDayTypeName(preset.dayType)}`;
                item.innerHTML = `
                    <span>${desc}</span>
                    <span>
                        <button class="btn btn-sm btn-outline-secondary edit-preset-btn" data-id="${preset.id}">✏️</button>
                        <button class="btn btn-sm btn-outline-danger delete-preset-btn" data-id="${preset.id}">🗑️</button>
                    </span>
                `;
                list.appendChild(item);
            });
        }

        // ----- Выпадающий список пресетов в форме добавления дня -----
        function renderPresetSelect() {
            const select = document.getElementById('presetSelect');
            // Очищаем все опции, кроме первой "Не использовать"
            select.innerHTML = '<option value="">-- Не использовать --</option>';
            presets.forEach(preset => {
                const option = document.createElement('option');
                option.value = preset.id;
                option.textContent = preset.name;
                select.appendChild(option);
            });
        }

        // ======  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ  ======
        function parseDate(dateStr) {
            // Из формата "dd.mm.yyyy" в объект Date
            const parts = dateStr.split('.');
            if (parts.length !== 3) return new Date(0);
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        function formatDate(date) {
            // Из объекта Date в строку "dd.mm.yyyy"
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        function getDayTypeName(type) {
            const map = { working: 'Рабочий', dayoff: 'Выходной', vacation: 'Отпуск', sick: 'Больничный' };
            return map[type] || type;
        }

        function getPresetTypeName(type) {
            const map = { income: 'Доход', expense: 'Расход', both: 'Доход и расход' };
            return map[type] || type;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        // ======  ОБРАБОТЧИКИ СОБЫТИЙ (кнопки, формы)  ======
        function attachEventListeners() {
            // Сохранение дня (добавление или редактирование)
            document.getElementById('saveDayBtn').addEventListener('click', saveDay);

            // Управление пресетами
            document.getElementById('showAddPresetFormBtn').addEventListener('click', showAddPresetForm);
            document.getElementById('savePresetBtn').addEventListener('click', savePreset);
            document.getElementById('cancelPresetEditBtn').addEventListener('click', hidePresetForm);

            // При выборе пресета в форме дня — автозаполнение полей
            document.getElementById('presetSelect').addEventListener('change', applyPresetToDayForm);

            // Обработчики на таблицу дней (кнопки редактирования и удаления)
            document.getElementById('daysTableBody').addEventListener('click', function(e) {
                if (e.target.classList.contains('delete-day-btn')) {
                    const index = e.target.getAttribute('data-index');
                    deleteDay(index);
                } else if (e.target.classList.contains('edit-day-btn')) {
                    const index = e.target.getAttribute('data-index');
                    editDay(index);
                }
            });

            // Обработчики на списке пресетов (кнопки редактирования и удаления)
            document.getElementById('presetsList').addEventListener('click', function(e) {
                if (e.target.classList.contains('edit-preset-btn')) {
                    const id = e.target.getAttribute('data-id');
                    editPreset(id);
                } else if (e.target.classList.contains('delete-preset-btn')) {
                    const id = e.target.getAttribute('data-id');
                    deletePreset(id);
                }
            });

            // При изменении типа пресета — показывать/прятать поля дохода/расхода
            document.getElementById('presetType').addEventListener('change', togglePresetAmountFields);
        }

        // ======  ЛОГИКА ДНЕЙ  ======
        function saveDay() {
            const dateInput = document.getElementById('dayDate').value; // в формате yyyy-mm-dd
            if (!dateInput) {
                alert('Пожалуйста, выберите дату!');
                return;
            }
            // Преобразуем в dd.mm.yyyy
            const date = formatDate(new Date(dateInput + 'T00:00:00')); // избегаем сдвига часовых поясов
            const type = document.getElementById('dayType').value;
            const income = parseFloat(document.getElementById('dayIncome').value) || 0;
            const expense = parseFloat(document.getElementById('dayExpense').value) || 0;
            const editIndex = parseInt(document.getElementById('editDayIndex').value);

            const dayData = { date, type, income, expense };

            if (editIndex >= 0 && editIndex < days.length) {
                // Режим редактирования
                days[editIndex] = dayData;
            } else {
                // Новый день
                days.push(dayData);
            }

            saveData();
            renderAll();
            resetDayForm();
            // Закрыть модальное окно
            const modal = bootstrap.Modal.getInstance(document.getElementById('addDayModal'));
            modal.hide();
        }

        function editDay(index) {
            const day = days[index];
            if (!day) return;
            // Заполняем форму
            document.getElementById('editDayIndex').value = index;
            document.getElementById('dayDate').value = parseDate(day.date).toISOString().split('T')[0];
            document.getElementById('dayType').value = day.type;
            document.getElementById('dayIncome').value = day.income;
            document.getElementById('dayExpense').value = day.expense;
            document.getElementById('presetSelect').value = ''; // Сбрасываем пресет
            document.getElementById('dayModalTitle').textContent = 'Редактировать день';
            // Открыть модальное окно
            new bootstrap.Modal(document.getElementById('addDayModal')).show();
        }

        function deleteDay(index) {
            if (confirm('Вы уверены, что хотите удалить эту запись?')) {
                days.splice(index, 1);
                saveData();
                renderAll();
            }
        }

        function resetDayForm() {
            document.getElementById('editDayIndex').value = -1;
            document.getElementById('dayForm').reset();
            document.getElementById('dayDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('presetSelect').value = '';
            document.getElementById('dayModalTitle').textContent = 'Добавить день';
        }

        // При выборе пресета в форме дня
        function applyPresetToDayForm() {
            const presetId = document.getElementById('presetSelect').value;
            if (!presetId) return;
            const preset = presets.find(p => p.id === presetId);
            if (!preset) return;
            // Устанавливаем тип дня
            document.getElementById('dayType').value = preset.dayType;
            // Устанавливаем доход/расход в зависимости от типа пресета
            if (preset.type === 'income' || preset.type === 'both') {
                document.getElementById('dayIncome').value = preset.income;
            }
            if (preset.type === 'expense' || preset.type === 'both') {
                document.getElementById('dayExpense').value = preset.expense;
            }
        }

        // ======  ЛОГИКА ПРЕСЕТОВ  ======
        function showAddPresetForm() {
            document.getElementById('addPresetFormContainer').style.display = 'block';
            document.getElementById('editPresetId').value = '';
            document.getElementById('presetName').value = '';
            document.getElementById('presetType').value = 'income';
            document.getElementById('presetIncome').value = 0;
            document.getElementById('presetExpense').value = 0;
            document.getElementById('presetDayType').value = 'working';
            togglePresetAmountFields();
        }

        function hidePresetForm() {
            document.getElementById('addPresetFormContainer').style.display = 'none';
            document.getElementById('editPresetId').value = '';
        }

        function togglePresetAmountFields() {
            const type = document.getElementById('presetType').value;
            document.getElementById('presetIncomeGroup').style.display = (type === 'income' || type === 'both') ? 'block' : 'none';
            document.getElementById('presetExpenseGroup').style.display = (type === 'expense' || type === 'both') ? 'block' : 'none';
        }

        function savePreset() {
            const name = document.getElementById('presetName').value.trim();
            if (!name) {
                alert('Введите название пресета!');
                return;
            }
            const type = document.getElementById('presetType').value;
            const income = parseFloat(document.getElementById('presetIncome').value) || 0;
            const expense = parseFloat(document.getElementById('presetExpense').value) || 0;
            const dayType = document.getElementById('presetDayType').value;
            const editId = document.getElementById('editPresetId').value;

            if (editId) {
                // Редактирование существующего пресета
                const preset = presets.find(p => p.id === editId);
                if (preset) {
                    preset.name = name;
                    preset.type = type;
                    preset.income = income;
                    preset.expense = expense;
                    preset.dayType = dayType;
                }
            } else {
                // Новый пресет
                presets.push({
                    id: generateId(),
                    name,
                    type,
                    income,
                    expense,
                    dayType
                });
            }

            saveData();
            renderAll();
            hidePresetForm();
        }

        function editPreset(id) {
            const preset = presets.find(p => p.id === id);
            if (!preset) return;
            document.getElementById('editPresetId').value = preset.id;
            document.getElementById('presetName').value = preset.name;
            document.getElementById('presetType').value = preset.type;
            document.getElementById('presetIncome').value = preset.income;
            document.getElementById('presetExpense').value = preset.expense;
            document.getElementById('presetDayType').value = preset.dayType;
            togglePresetAmountFields();
            document.getElementById('addPresetFormContainer').style.display = 'block';
        }

        function deletePreset(id) {
            if (confirm('Удалить пресет?')) {
                presets = presets.filter(p => p.id !== id);
                saveData();
                renderAll();
                hidePresetForm();
            }
        }

        // При открытии модального окна "Добавить день" сбрасываем форму (если не редактирование)
        document.getElementById('addDayModal').addEventListener('show.bs.modal', function(event) {
            // Если модальное окно открывается по кнопке "Добавить день", а не из editDay,
            // editDay сам устанавливает поля, поэтому мы проверим, не установлен ли editIndex
            const editIndex = document.getElementById('editDayIndex').value;
            if (editIndex === '-1' || event.relatedTarget && event.relatedTarget.getAttribute('data-bs-target') === '#addDayModal') {
                resetDayForm();
            }
        });

    </script>
</body>
</html>
