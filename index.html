<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Дневник зарплаты</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .stat-card { border-radius: 15px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-3px); }
        .day-working { border-left: 4px solid #198754; }
        .day-dayoff { border-left: 4px solid #6c757d; }
        .day-vacation { border-left: 4px solid #0dcaf0; }
        .day-sick { border-left: 4px solid #ffc107; }
        .day-mixed { border-left: 4px solid #6f42c1; }
        .navbar-brand { font-weight: bold; }
        .group-row { cursor: pointer; }
        .details-row td { padding: 0; }
    </style>
</head>
<body>
    <!-- Навигационная панель -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand">💰 Дневник зарплаты</span>
            <div class="navbar-nav ms-auto">
                <button class="btn btn-outline-light me-2" data-bs-toggle="modal" data-bs-target="#addPresetModal">⚡ Категории</button>
                <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addDayModal">+ Добавить день</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Статистика -->
        <h3 class="mb-3">📊 Статистика</h3>
        <div id="statsContainer">
            <!-- Карточки вставит JS -->
        </div>

        <!-- Журнал дней -->
        <h3 class="mb-3 mt-4">📅 Журнал дней</h3>
        <div class="table-responsive">
            <table class="table table-hover align-middle bg-white shadow-sm rounded">
                <thead class="table-dark">
                    <tr>
                        <th>Дата</th>
                        <th>Тип дня</th>
                        <th>Доход</th>
                        <th>Расход</th>
                        <th></th> <!-- Действия (пустая ячейка) -->
                    </tr>
                </thead>
                <tbody id="daysTableBody">
                    <!-- JS заполнит -->
                </tbody>
            </table>
        </div>
        <div id="noDaysMessage" class="text-center text-muted mt-3" style="display: none;">
            Нет записей. Добавьте первый рабочий день!
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: Добавление/редактирование дня ===== -->
    <div class="modal fade" id="addDayModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dayModalTitle">Добавить день</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="dayForm">
                        <input type="hidden" id="editDayIndex" value="-1">
                        <div class="mb-3">
                            <label class="form-label">Дата (дд.мм.гггг)</label>
                            <input type="date" class="form-control" id="dayDate" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Тип дня</label>
                            <select class="form-select" id="dayType">
                                <option value="working">Рабочий</option>
                                <option value="dayoff">Выходной</option>
                                <option value="vacation">Отпуск</option>
                                <option value="sick">Больничный</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Категория (необязательно)</label>
                            <select class="form-select" id="presetSelect">
                                <option value="">-- Без категории --</option>
                                <!-- JS добавит -->
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Доход (₽)</label>
                            <input type="number" class="form-control" id="dayIncome" step="0.01" min="0" value="0">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Расход (₽)</label>
                            <input type="number" class="form-control" id="dayExpense" step="0.01" min="0" value="0">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="saveDayBtn">Сохранить</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== МОДАЛЬНОЕ ОКНО: Категории ===== -->
    <div class="modal fade" id="addPresetModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">⚡ Категории</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <button class="btn btn-success btn-sm" id="showAddPresetFormBtn">+ Создать категорию</button>
                    </div>
                    <div id="addPresetFormContainer" style="display: none;" class="border p-3 mb-3 rounded bg-light">
                        <h6>Новая категория</h6>
                        <input type="hidden" id="editPresetId" value="">
                        <div class="mb-2">
                            <input type="text" class="form-control" id="presetName" placeholder="Название (например, Топливо)">
                        </div>
                        <button class="btn btn-primary btn-sm" id="savePresetBtn">Сохранить</button>
                        <button class="btn btn-secondary btn-sm" id="cancelPresetEditBtn">Отмена</button>
                    </div>
                    <hr>
                    <h6>Сохранённые категории</h6>
                    <div class="list-group" id="presetsList">
                        <!-- Список -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Основная логика -->
    <script>
        // ====== ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ======
        let days = [];           // { date, type, category, income, expense }
        let presets = [];       // { id, name }
        const STORAGE_DAYS = 'salary_diary_days';
        const STORAGE_PRESETS = 'salary_diary_presets';

        // ====== ИНИЦИАЛИЗАЦИЯ ======
        document.addEventListener('DOMContentLoaded', function() {
            loadData();
            renderAll();
            attachEventListeners();
            document.getElementById('dayDate').value = new Date().toISOString().split('T')[0];
        });

        function loadData() {
            const savedDays = localStorage.getItem(STORAGE_DAYS);
            const savedPresets = localStorage.getItem(STORAGE_PRESETS);
            days = savedDays ? JSON.parse(savedDays) : [];
            presets = savedPresets ? JSON.parse(savedPresets) : [];
        }

        function saveData() {
            localStorage.setItem(STORAGE_DAYS, JSON.stringify(days));
            localStorage.setItem(STORAGE_PRESETS, JSON.stringify(presets));
        }

        function renderAll() {
            renderDaysTable();
            renderStats();
            renderPresetsList();
            renderPresetSelect();
        }

        // ====== ТАБЛИЦА ДНЕЙ С ГРУППИРОВКОЙ ======
        function renderDaysTable() {
            const tbody = document.getElementById('daysTableBody');
            const noMsg = document.getElementById('noDaysMessage');
            tbody.innerHTML = '';

            if (days.length === 0) {
                noMsg.style.display = 'block';
                return;
            }
            noMsg.style.display = 'none';

            // Группируем по дате
            const grouped = new Map();
            days.forEach(day => {
                if (!grouped.has(day.date)) {
                    grouped.set(day.date, []);
                }
                grouped.get(day.date).push(day);
            });

            // Сортируем даты по убыванию
            const sortedDates = Array.from(grouped.keys()).sort((a, b) => {
                return parseDate(b) - parseDate(a);
            });

            sortedDates.forEach(date => {
                const group = grouped.get(date);
                const totalIncome = group.reduce((sum, d) => sum + (Number(d.income) || 0), 0);
                const totalExpense = group.reduce((sum, d) => sum + (Number(d.expense) || 0), 0);

                // Определяем тип дня для строки-агрегата
                const types = new Set(group.map(d => d.type));
                const displayType = types.size === 1 ? group[0].type : 'mixed';

                // Создаём строку-агрегат (5 ячеек)
                const groupRow = document.createElement('tr');
                groupRow.className = `group-row day-${displayType}`;
                groupRow.innerHTML = `
                    <td><strong>${date}</strong> <span class="toggle-icon">▶</span></td>
                    <td>${getDayTypeName(displayType)}</td>
                    <td class="text-success fw-bold">${totalIncome.toFixed(2)} ₽</td>
                    <td class="text-danger fw-bold">${totalExpense.toFixed(2)} ₽</td>
                    <td></td>
                `;
                tbody.appendChild(groupRow);

                // Строка с деталями (скрыта)
                const detailsRow = document.createElement('tr');
                detailsRow.className = 'details-row';
                detailsRow.style.display = 'none';
                detailsRow.innerHTML = `
                    <td colspan="5" class="p-0">
                        <div class="p-2 bg-light">
                            <table class="table table-sm mb-0">
                                <thead>
                                    <tr>
                                        <th>Категория</th>
                                        <th>Доход</th>
                                        <th>Расход</th>
                                        <th>Тип</th>
                                        <th></th>
                                    </tr>
                                </thead>
                                <tbody class="details-tbody">
                                    ${group.map(day => {
                                        const realIndex = days.indexOf(day);
                                        return `
                                            <tr>
                                                <td>${day.category || '—'}</td>
                                                <td class="text-success">${day.income.toFixed(2)} ₽</td>
                                                <td class="text-danger">${day.expense.toFixed(2)} ₽</td>
                                                <td>${getDayTypeName(day.type)}</td>
                                                <td>
                                                    <button class="btn btn-sm btn-outline-secondary edit-day-btn" data-index="${realIndex}">✏️</button>
                                                    <button class="btn btn-sm btn-outline-danger delete-day-btn" data-index="${realIndex}">🗑️</button>
                                                </td>
                                            </tr>
                                        `;
                                    }).join('')}
                                </tbody>
                            </table>
                        </div>
                    </td>
                `;
                tbody.appendChild(detailsRow);

                // Обработчик клика по групповой строке
                groupRow.addEventListener('click', function(e) {
                    if (e.target.tagName === 'BUTTON') return;
                    const icon = groupRow.querySelector('.toggle-icon');
                    if (detailsRow.style.display === 'none') {
                        detailsRow.style.display = '';
                        icon.textContent = '▼';
                    } else {
                        detailsRow.style.display = 'none';
                        icon.textContent = '▶';
                    }
                });
            });
        }

        // ====== СТАТИСТИКА (без изменений, только раскладка) ======
        function renderStats() {
            const container = document.getElementById('statsContainer');
            if (days.length === 0) {
                container.innerHTML = `<div class="text-muted">Нет данных для статистики</div>`;
                return;
            }

            let totalIncome = 0, totalExpense = 0;
            let workingDays = [], allDays = [];

            days.forEach(day => {
                totalIncome += Number(day.income) || 0;
                totalExpense += Number(day.expense) || 0;
                allDays.push(day);
                if (day.type === 'working') workingDays.push(day);
            });

            const daysCount = allDays.length;
            const workingDaysCount = workingDays.length;
            const avgIncomeAll = totalIncome / daysCount;
            const avgExpenseAll = totalExpense / daysCount;
            const totalWorkingIncome = workingDays.reduce((s, d) => s + (Number(d.income) || 0), 0);
            const totalWorkingExpense = workingDays.reduce((s, d) => s + (Number(d.expense) || 0), 0);
            const avgIncomeWorking = workingDaysCount > 0 ? totalWorkingIncome / workingDaysCount : 0;
            const avgExpenseWorking = workingDaysCount > 0 ? totalWorkingExpense / workingDaysCount : 0;
            const netBalance = totalIncome - totalExpense;

            container.innerHTML = `
                <div class="row g-3 mb-3">
                    <div class="col-md-4"><div class="card stat-card bg-success text-white"><div class="card-body"><h6>Общий доход</h6><p class="fs-5 fw-bold">${totalIncome.toFixed(2)} ₽</p></div></div></div>
                    <div class="col-md-4"><div class="card stat-card bg-danger text-white"><div class="card-body"><h6>Общий расход</h6><p class="fs-5 fw-bold">${totalExpense.toFixed(2)} ₽</p></div></div></div>
                    <div class="col-md-4"><div class="card stat-card ${netBalance >= 0 ? 'bg-primary' : 'bg-warning'} text-white"><div class="card-body"><h6>Чистый остаток</h6><p class="fs-5 fw-bold">${netBalance.toFixed(2)} ₽</p></div></div></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-6"><div class="card stat-card bg-info text-dark"><div class="card-body"><h6>Средний доход / день</h6><p class="fs-5 fw-bold">${avgIncomeAll.toFixed(2)} ₽</p></div></div></div>
                    <div class="col-md-6"><div class="card stat-card bg-info text-dark"><div class="card-body"><h6>Средний расход / день</h6><p class="fs-5 fw-bold">${avgExpenseAll.toFixed(2)} ₽</p></div></div></div>
                </div>
                <div class="row g-3">
                    <div class="col-md-4"><div class="card stat-card bg-success text-white"><div class="card-body"><h6>Средний доход / раб. день</h6><p class="fs-5 fw-bold">${avgIncomeWorking.toFixed(2)} ₽</p></div></div></div>
                    <div class="col-md-4"><div class="card stat-card bg-danger text-white"><div class="card-body"><h6>Средний расход / раб. день</h6><p class="fs-5 fw-bold">${avgExpenseWorking.toFixed(2)} ₽</p></div></div></div>
                    <div class="col-md-4"><div class="card stat-card bg-secondary text-white"><div class="card-body"><h6>Рабочих дней</h6><p class="fs-5 fw-bold">${workingDaysCount} из ${daysCount}</p></div></div></div>
                </div>
            `;
        }

        // ====== КАТЕГОРИИ (пресеты) ======
        function renderPresetsList() {
            const list = document.getElementById('presetsList');
            list.innerHTML = '';
            if (presets.length === 0) {
                list.innerHTML = '<div class="list-group-item text-muted">Категорий пока нет</div>';
                return;
            }
            presets.forEach(p => {
                const div = document.createElement('div');
                div.className = 'list-group-item d-flex justify-content-between align-items-center';
                div.innerHTML = `<span>${p.name}</span>
                    <span>
                        <button class="btn btn-sm btn-outline-secondary edit-preset-btn" data-id="${p.id}">✏️</button>
                        <button class="btn btn-sm btn-outline-danger delete-preset-btn" data-id="${p.id}">🗑️</button>
                    </span>`;
                list.appendChild(div);
            });
        }

        function renderPresetSelect() {
            const select = document.getElementById('presetSelect');
            select.innerHTML = '<option value="">-- Без категории --</option>';
            presets.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.id;
                opt.textContent = p.name;
                select.appendChild(opt);
            });
        }

        // ====== ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ======
        function parseDate(dateStr) {
            const parts = dateStr.split('.');
            if (parts.length !== 3) return new Date(0);
            return new Date(parts[2], parts[1] - 1, parts[0]);
        }

        function formatDate(date) {
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}.${month}.${year}`;
        }

        function getDayTypeName(type) {
            const map = { working: 'Рабочий', dayoff: 'Выходной', vacation: 'Отпуск', sick: 'Больничный', mixed: 'Смешанный' };
            return map[type] || type;
        }

        function generateId() {
            return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
        }

        // ====== ОБРАБОТЧИКИ СОБЫТИЙ ======
        function attachEventListeners() {
            document.getElementById('saveDayBtn').addEventListener('click', saveDay);
            document.getElementById('showAddPresetFormBtn').addEventListener('click', showAddPresetForm);
            document.getElementById('savePresetBtn').addEventListener('click', savePreset);
            document.getElementById('cancelPresetEditBtn').addEventListener('click', hidePresetForm);

            // Делегирование кликов на таблице дней
            document.getElementById('daysTableBody').addEventListener('click', function(e) {
                const editBtn = e.target.closest('.edit-day-btn');
                const deleteBtn = e.target.closest('.delete-day-btn');
                if (editBtn) {
                    const index = editBtn.getAttribute('data-index');
                    editDay(index);
                }
                if (deleteBtn) {
                    const index = deleteBtn.getAttribute('data-index');
                    deleteDay(index);
                }
            });

            // Делегирование кликов на списке пресетов
            document.getElementById('presetsList').addEventListener('click', function(e) {
                const editBtn = e.target.closest('.edit-preset-btn');
                const deleteBtn = e.target.closest('.delete-preset-btn');
                if (editBtn) {
                    const id = editBtn.getAttribute('data-id');
                    editPreset(id);
                }
                if (deleteBtn) {
                    const id = deleteBtn.getAttribute('data-id');
                    deletePreset(id);
                }
            });
        }

        // ====== ЛОГИКА ДНЕЙ ======
        function saveDay() {
            const dateInput = document.getElementById('dayDate').value;
            if (!dateInput) {
                alert('Выберите дату!');
                return;
            }
            const date = formatDate(new Date(dateInput + 'T00:00:00'));
            const type = document.getElementById('dayType').value;
            const presetId = document.getElementById('presetSelect').value;
            let category = '';
            if (presetId) {
                const preset = presets.find(p => p.id === presetId);
                category = preset ? preset.name : '';
            }
            const income = parseFloat(document.getElementById('dayIncome').value) || 0;
            const expense = parseFloat(document.getElementById('dayExpense').value) || 0;
            const editIndex = parseInt(document.getElementById('editDayIndex').value);

            const dayData = { date, type, category, income, expense };

            if (editIndex >= 0 && editIndex < days.length) {
                days[editIndex] = dayData;
            } else {
                days.push(dayData);
            }

            saveData();
            renderAll();
            resetDayForm();
            bootstrap.Modal.getInstance(document.getElementById('addDayModal')).hide();
        }

        function editDay(index) {
            const day = days[index];
            if (!day) return;
            document.getElementById('editDayIndex').value = index;
            document.getElementById('dayDate').value = parseDate(day.date).toISOString().split('T')[0];
            document.getElementById('dayType').value = day.type;
            const preset = presets.find(p => p.name === day.category);
            document.getElementById('presetSelect').value = preset ? preset.id : '';
            document.getElementById('dayIncome').value = day.income;
            document.getElementById('dayExpense').value = day.expense;
            document.getElementById('dayModalTitle').textContent = 'Редактировать день';
            new bootstrap.Modal(document.getElementById('addDayModal')).show();
        }

        function deleteDay(index) {
            if (confirm('Удалить эту запись?')) {
                days.splice(index, 1);
                saveData();
                renderAll();
            }
        }

        function resetDayForm() {
            document.getElementById('editDayIndex').value = -1;
            document.getElementById('dayForm').reset();
            document.getElementById('dayDate').value = new Date().toISOString().split('T')[0];
            document.getElementById('presetSelect').value = '';
            document.getElementById('dayModalTitle').textContent = 'Добавить день';
        }

        // ====== ЛОГИКА КАТЕГОРИЙ ======
        function showAddPresetForm() {
            document.getElementById('addPresetFormContainer').style.display = 'block';
            document.getElementById('editPresetId').value = '';
            document.getElementById('presetName').value = '';
        }

        function hidePresetForm() {
            document.getElementById('addPresetFormContainer').style.display = 'none';
            document.getElementById('editPresetId').value = '';
        }

        function savePreset() {
            const name = document.getElementById('presetName').value.trim();
            if (!name) {
                alert('Введите название категории!');
                return;
            }
            const editId = document.getElementById('editPresetId').value;

            if (editId) {
                const preset = presets.find(p => p.id === editId);
                if (preset) {
                    const oldName = preset.name;
                    preset.name = name;
                    // Обновить категорию во всех днях
                    days.forEach(day => {
                        if (day.category === oldName) day.category = name;
                    });
                }
            } else {
                presets.push({ id: generateId(), name });
            }

            saveData();
            renderAll();
            hidePresetForm();
        }

        function editPreset(id) {
            const preset = presets.find(p => p.id === id);
            if (!preset) return;
            document.getElementById('editPresetId').value = preset.id;
            document.getElementById('presetName').value = preset.name;
            document.getElementById('addPresetFormContainer').style.display = 'block';
        }

        function deletePreset(id) {
            if (confirm('Удалить категорию?')) {
                presets = presets.filter(p => p.id !== id);
                saveData();
                renderAll();
                hidePresetForm();
            }
        }

        // Сброс формы при открытии модального окна добавления дня
        document.getElementById('addDayModal').addEventListener('show.bs.modal', function(event) {
            const editIndex = document.getElementById('editDayIndex').value;
            if (editIndex === '-1' || (event.relatedTarget && event.relatedTarget.getAttribute('data-bs-target') === '#addDayModal')) {
                resetDayForm();
            }
        });
    </script>
</body>
</html>
